services:
  - type: web
    name: deepak-marble-backend
    env: node
    plan: free
    buildCommand: cd Server && npm ci --include=dev && npm run build
    startCommand: cd Server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: NODE_VERSION
        value: 22.14.0
      - key: MONGO_URI
        sync: false
    healthCheckPath: /api/contacts


